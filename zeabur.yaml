# Zeabur 部署配置
# 文档: https://docs.zeabur.com/deploy/dockerfile
version: "1.0"

services:
  erp:
    type: dockerfile
    build:
      dockerfile: Dockerfile
      context: .
    ports:
      - port: 8000
        protocol: TCP
        public: true
    # 显式HTTP健康检查: 探/health轻量JSON端点; 给足uvicorn+pandas+seed冷启动时间
    healthCheck:
      http:
        port: 8000
        path: /health
      startupDelay: 90
      interval: 15
      timeout: 5
      retries: 10
    # 启动命令(兜底: Zeabur不执行Dockerfile CMD则用此) - 极简, 无timeout/proc重定向
    startCommand: sh -c "python scripts/seed_data.py; exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --no-access-log"
    # ERP IO密集,basic足够
    plan: basic
    env:
      JWT_SECRET:
        description: "JWT签名密钥,生产环境务必改成随机长字符串"
        default: "zeabur-prod-change-me-please-use-long-random-string-32chars+"
      JWT_TTL_MINUTES:
        default: "1440"
      DB_DRIVER:
        default: "sqlite"
      DB_URL:
        default: "sqlite:////app/data/erp.db"
      PYTHONUNBUFFERED:
        default: "1"
      PYTHONPATH:
        default: "/app"
    volumes:
      - name: data
        mountPath: /app/data
