# Zeabur 部署配置
# 文档: https://docs.zeabur.com/deploy/dockerfile
version: "1.0"

services:
  erp:
    type: dockerfile
    build:
      dockerfile: Dockerfile
      context: .
    ports:
      - port: 8000
        protocol: TCP
        public: true
    # 显式HTTP健康检查: 探/health轻量JSON端点; 给足uvicorn+pandas+seed冷启动时间
    # 【关键修正】不写port字段! Zeabur平台自动用注入的$PORT探活,
    # 之前写死port:8000 + UI手填PORT=8000 => 覆盖平台$PORT => 端口错位 => 永久502
    healthCheck:
      http:
        path: /health
      startupDelay: 90
      interval: 15
      timeout: 5
      retries: 10
    # 启动命令(兜底): PORT数字校验(用户误填${WEB_PORT}这种字面量/0/空 一律回落8000), os.execvp替换PID1
    startCommand: python -c "import os,subprocess; _raw=os.environ.get('PORT','8000'); _int=int(_raw) if str(_raw).isdigit() else 8000; _int=8000 if _int<1 or _int>65535 else _int; port=str(_int); print(f'[BOOT] resolved PORT={port} (raw={repr(_raw)})', flush=True); subprocess.run(['python','scripts/seed_if_empty.py'], check=False); subprocess.run(['python','scripts/seed_data.py'], check=False); os.execvp('uvicorn',['uvicorn','app.main:app','--host','0.0.0.0','--port',port,'--no-access-log'])"
    # ERP IO密集,basic足够
    plan: basic
    env:
      JWT_SECRET:
        description: "JWT签名密钥,生产环境务必改成随机长字符串"
        default: "zeabur-prod-change-me-please-use-long-random-string-32chars+"
      JWT_TTL_MINUTES:
        default: "1440"
      DB_DRIVER:
        default: "sqlite"
      DB_URL:
        default: "sqlite:////app/data/erp.db"
      PYTHONUNBUFFERED:
        default: "1"
      PYTHONPATH:
        default: "/app"
      # 【删除PORT声明】Zeabur平台会自动注入$PORT, 不要在这里声明/默认8000,
      # 否则UI环境变量面板会出现PORT=8000覆盖平台$PORT => 端口错位502
      # DeepSeek AI分析模块 =====
      DEEPSEEK_API_KEY:
        description: "DeepSeek API Key, 格式sk-xxx, AI分析模块必填否则功能禁用"
        default: ""
      DEEPSEEK_BASE_URL:
        description: "DeepSeek Base URL, 默认官方 https://api.deepseek.com, 中转填中转域名(不带/chat/completions)"
        default: "https://api.deepseek.com"
      DEEPSEEK_MODEL_FAST:
        description: "意图解析用(便宜/快)  deepseek-v4-flash"
        default: "deepseek-v4-flash"
      DEEPSEEK_MODEL_PRO:
        description: "报告生成用(强/贵)  deepseek-v4-pro"
        default: "deepseek-v4-pro"
    volumes:
      - name: data
        mountPath: /app/data
