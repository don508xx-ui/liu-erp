# Zeabur 部署配置
# 文档: https://docs.zeabur.com/deploy/dockerfile
version: "1.0"

services:
  erp:
    type: dockerfile
    build:
      dockerfile: Dockerfile
      context: .
    ports:
      - port: 8000
        protocol: TCP
        public: true
    # 显式HTTP健康检查: 探/health轻量JSON端点; 给足uvicorn+pandas+seed冷启动时间
    # 【关键】port字段不要写死8000! Zeabur注入$PORT到容器, 平台HTTP探针实际打到$PORT
    healthCheck:
      http:
        port: 8000
        path: /health
      startupDelay: 90
      interval: 15
      timeout: 5
      retries: 10
    # 启动命令(兜底): PORT数字校验(用户误填${WEB_PORT}这种字面量/0/空 一律回落8000), os.execvp替换PID1
    startCommand: python -c "import os,subprocess; _raw=os.environ.get('PORT','8000'); _int=int(_raw) if str(_raw).isdigit() else 8000; _int=8000 if _int<1 or _int>65535 else _int; port=str(_int); print(f'[BOOT] resolved PORT={port} (raw={repr(_raw)})', flush=True); subprocess.run(['python','scripts/seed_data.py'], check=False); os.execvp('uvicorn',['uvicorn','app.main:app','--host','0.0.0.0','--port',port,'--no-access-log'])"
    # ERP IO密集,basic足够
    plan: basic
    env:
      JWT_SECRET:
        description: "JWT签名密钥,生产环境务必改成随机长字符串"
        default: "zeabur-prod-change-me-please-use-long-random-string-32chars+"
      JWT_TTL_MINUTES:
        default: "1440"
      DB_DRIVER:
        default: "sqlite"
      DB_URL:
        default: "sqlite:////app/data/erp.db"
      PYTHONUNBUFFERED:
        default: "1"
      PYTHONPATH:
        default: "/app"
      # 【硬性】PORT=8000, 覆盖UI里手填的${WEB_PORT}字面量, 保证有效数字
      PORT:
        default: "8000"
        generate: false
    volumes:
      - name: data
        mountPath: /app/data
