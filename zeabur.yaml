# Zeabur 部署配置
# 文档: https://docs.zeabur.com/deploy/dockerfile
version: "1.0"

services:
  erp:
    type: dockerfile
    build:
      dockerfile: Dockerfile
      context: .
    ports:
      - port: 8000
        protocol: TCP
        public: true
    # 显式HTTP健康检查: Zeabur在3次探活失败后会标记502,这里用更长的startupDelay兜底
    healthCheck:
      http:
        port: 8000
        path: /
      startupDelay: 60
      interval: 20
      timeout: 5
      retries: 6
    # 启动命令(兜底:若Zeabur不执行Dockerfile CMD则用此)
    startCommand: sh -c "timeout 90 python scripts/seed_data.py 2>&1 || true; exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --no-access-log --timeout-keep-alive 30"
    # ERP IO密集,basic足够
    plan: basic
    env:
      JWT_SECRET:
        description: "JWT签名密钥,生产环境务必改成随机长字符串"
        default: "zeabur-prod-change-me-please-use-long-random-string-32chars+"
      JWT_TTL_MINUTES:
        default: "1440"
      DB_DRIVER:
        default: "sqlite"
      DB_URL:
        default: "sqlite:////app/data/erp.db"
      PYTHONUNBUFFERED:
        default: "1"
      PYTHONPATH:
        default: "/app"
    volumes:
      - name: data
        mountPath: /app/data
